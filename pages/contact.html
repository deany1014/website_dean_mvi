<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodo Jiu Jitsu - Contact</title>
    <link rel="shortcut icon" type="image/png" href="../static/images/logo.png">
    
    <script src="../static/js/partials.js" defer></script>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

    <header id="site-header"></header>

    <div style="justify-content: center; display: flex; margin-top: -35px;">
        <h1 style="border-bottom: 5px solid black;">Contactpagina</h1>
    </div>

    <div class="contactbox">
        
        <form action="">
            <input type="text">
            <input type="email">
            <div class="message">
                <input type="text">
                <input type="text">
            </div>
            
        </form>

    </div>
    
    <div class="visit-us-banner">
        <div class="visit-us-text-container">
            <h1>Bezoek ons op:</h1>
            <p>Sportcentrum De Pijp</p>
            <p>Lizzy Ansinghstraat 88</p>
            <p>1072 RD Amsterdam</p>

        </div>

        <div class="maps">
            <iframe 
            src="https://www.google.com/maps/embed/v1/place?key=AIzaSyB2NIWI3Tv9iDPrlnowr_0ZqZWoAQydKJU&q=Sportcentrum%20De%20Pijp%2C%20Lizzy%20Ansinghstraat%2C%20Amsterdam%2C%20Nederland&zoom=15&maptype=roadmap" 
            width="600" 
            height="450" 
            style="border:0;" 
            allowfullscreen="" 
            loading="lazy" 
            referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </div>

    </div>


    <footer id="site-footer"></footer>

</body>
</html>
